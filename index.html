var editingId = null;

database.ref('logs').on('value', function(snapshot) {
  var data = snapshot.val();
  globalLogs = [];
  if (data) {
    Object.keys(data).forEach(function(key) {
      globalLogs.push(Object.assign({ id: key }, data[key]));
    });
    localStorage.setItem('myMapLogs', JSON.stringify(globalLogs));
  } else {
    globalLogs = JSON.parse(localStorage.getItem('myMapLogs') || '[]');
  }
  
  // 데이터 동기화 즉시 화면 및 날짜별 그룹 갱신

});

  var currentRecordingState = {
    active: false,
    type: null,
    startTime: null,
    startStr: '',
    pathCoords: [],
    polyline: null
  };

  var timerInterval = null;
  var watchPositionId = null;

  // GPS 위치 실시간 추적
  if ("geolocation" in navigator) {
    watchPositionId = navigator.geolocation.watchPosition(function(pos) {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      var latLng = new kakao.maps.LatLng(currentLat, currentLng);

      currentMarker.setPosition(latLng);

      if (currentRecordingState.active) {
        currentRecordingState.pathCoords.push(latLng);
        if (currentRecordingState.polyline) {
          currentRecordingState.polyline.setPath(currentRecordingState.pathCoords);
        }
        document.getElementById('pathPointCount').textContent = '(' + currentRecordingState.pathCoords.length + 'pts)';
      }

      geocoder.coord2Address(currentLng, currentLat, function(result, status) {
        if (status === kakao.maps.services.Status.OK) {
          var addr = result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
          currentAddressStr = addr;
          document.getElementById('currentLocText').innerHTML = '<i class="ti ti-map-pin"></i> 현재 위치: <strong>' + addr + '</strong>';
        }
      });
    }, function(err) {
      console.warn("GPS 수신 오류:", err.message);
    }, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    });
  } else {
    alert("GPS(위치 정보)를 지원하지 않는 브라우저입니다.");
  }

  function fmt(n) { return String(n).padStart(2, '0'); }
  function nowShortTimeStr() { var d = new Date(); return d.getHours() + ':' + fmt(d.getMinutes()); }

  function formatStopwatch(ms) {
    var sec = Math.floor(ms / 1000);
    return '[' + fmt(Math.floor(sec / 3600)) + ':' + fmt(Math.floor((sec % 3600) / 60)) + ':' + fmt(sec % 60) + ']';
  }

  function formatDurationText(ms) {
    var sec = Math.floor(ms / 1000);
    var hrs = Math.floor(sec / 3600);
    var mins = Math.floor((sec % 3600) / 60);
    return hrs + ':' + fmt(mins);
  }

  function buildPanel(cat) {
    var isRoad = cat === 'road';
    var panelBtn = document.getElementById(isRoad ? 'panelRoadBtn' : 'panelParkingBtn');
    
    panelBtn.innerHTML =
      '<button class="startBtn" style="flex:1; height:40px; border-radius:var(--radius); border:0.5px solid var(--border-strong); background:var(--bg-success); color:var(--text-success); font-size:13px; font-weight:600; cursor:pointer;"><i class="ti ti-player-play"></i>취득 시작</button>' +
      '<button class="stopBtn" style="flex:1; height:40px; border-radius:var(--radius); border:0.5px solid var(--border-strong); background:var(--bg-danger); color:var(--text-danger); font-size:13px; font-weight:600; opacity:0.5; cursor:pointer;" disabled><i class="ti ti-player-pause"></i>취득 종료</button>';

    var startBtn = panelBtn.querySelector('.startBtn');
    var stopBtn = panelBtn.querySelector('.stopBtn');

    startBtn.addEventListener('click', function() {
      if (currentRecordingState.active) {
        alert("이미 다른 측정이 진행 중입니다.");
        return;
      }

      var startLatLng = new kakao.maps.LatLng(currentLat, currentLng);
      map.panTo(startLatLng);

      var newPolyline = new kakao.maps.Polyline({
        map: map,
        path: [startLatLng],
        strokeWeight: 5,
        strokeColor: isRoad ? '#0d6efd' : '#198754',
        strokeOpacity: 0.8,
        strokeStyle: 'solid'
      });

      currentRecordingState = {
        active: true,
        type: cat,
        startTime: Date.now(),
        startStr: nowShortTimeStr(),
        pathCoords: [startLatLng],
        polyline: newPolyline
      };

      syncUI();
    });

    stopBtn.addEventListener('click', function() {
      if (!currentRecordingState.active || currentRecordingState.type !== cat) return;

      var envVal = '';
      if (isRoad) {
        var choice = prompt('주행 환경을 선택해주세요 (1 또는 2 입력):\n1. 일반도로\n2. 고속도로', '1');
        if (choice === null) return;
        envVal = (choice.trim() === '2') ? '고속도로' : '일반도로';
      } else {
        envVal = '지하주차장';
      }

      var durationMs = Date.now() - currentRecordingState.startTime;
      var durationStr = formatDurationText(durationMs);
      var endStr = nowShortTimeStr();

      var endLocationName = currentAddressStr;

      var scenarioVal = document.getElementById(isRoad ? 'roadScenario' : 'parkingScenario').value || (isRoad ? '주행' : '주차');
      var targetVal = document.getElementById(isRoad ? 'roadTarget' : 'parkingTarget').value;
      var specialVal = document.getElementById(isRoad ? 'roadSpecialCar' : 'parkingSpecialCar').value;
      var childVal = document.getElementById(isRoad ? 'roadChild' : 'parkingChild').value;
      var noteVal = document.getElementById(isRoad ? 'roadNote' : 'parkingNote').value;

      var logData = {
        type: cat,
        scenario: scenarioVal,
        location: endLocationName,
        env: envVal,
        startTime: currentRecordingState.startStr,
        endTime: endStr,
        duration: durationStr,
        target: targetVal,
        special: specialVal,
        child: childVal,
        note: noteVal,
        timestamp: Date.now()
      };

      database.ref('logs').push(logData);

      currentRecordingState.active = false;
      syncUI();
      alert('취득이 완료되었습니다!\n종료 위치: ' + endLocationName);
    });
  }

  function syncUI() {
    var isRec = currentRecordingState.active;
    var recType = currentRecordingState.type;

    ['road', 'parking'].forEach(function(cat) {
      var panelBtn = document.getElementById(cat === 'road' ? 'panelRoadBtn' : 'panelParkingBtn');
      var inputsBox = document.getElementById(cat === 'road' ? 'panelRoadInputs' : 'panelParkingInputs');
      var startBtn = panelBtn.querySelector('.startBtn');
      var stopBtn = panelBtn.querySelector('.stopBtn');

      var thisIsRec = isRec && recType === cat;

      startBtn.disabled = isRec;
      startBtn.style.opacity = isRec ? '0.5' : '1';

      stopBtn.disabled = !thisIsRec;
      stopBtn.style.opacity = thisIsRec ? '1' : '0.5';

      inputsBox.style.display = thisIsRec ? 'flex' : 'none';
    });

    var overlayTimer = document.getElementById('mapOverlayTimer');
    var overlayTimerVal = document.getElementById('overlayTimerVal');

    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

    if (isRec) {
      overlayTimer.style.display = 'flex';
      var updateTimer = function() {
        overlayTimerVal.textContent = formatStopwatch(Date.now() - currentRecordingState.startTime);
      };
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    } else {
      overlayTimer.style.display = 'none';
    }
  }

  buildPanel('road');
  buildPanel('parking');

  // 지도 재계산 로직이 포함된 화면 전환 함수
  function showView(viewId) {
    document.getElementById('menuMain').style.display = 'none';
    document.getElementById('viewRecord').style.display = 'none';
    document.getElementById('viewHistory').style.display = 'none';
    document.getElementById('viewEmail').style.display = 'none';

    if (viewId === 'main') {
      document.getElementById('menuMain').style.display = 'flex';

      document.getElementById('viewRecord').style.display = 'flex';

    } else if (viewId === 'email') {
      document.getElementById('viewEmail').style.display = 'flex';
    }

    // 패널 크기 변화 대응 지도 재계산
    setTimeout(function() {
      if (map) {
        var center = map.getCenter();
        map.relayout();
        map.setCenter(center);
      }
    }, 100);
  }

  document.getElementById('menuBtnRecord').addEventListener('click', function() { showView('record'); });
  document.getElementById('menuBtnHistory').addEventListener('click', function() { showView('history'); });
  document.getElementById('menuBtnEmailView').addEventListener('click', function() { showView('email'); });
  
  document.querySelectorAll('.backToMenu').forEach(function(btn) {

  document.getElementById('btnSaveEmail').addEventListener('click', function() {
    var emailVal = document.getElementById('targetEmailInput').value.trim();
    localStorage.setItem('savedTargetEmail', emailVal);

    msg.style.display = 'inline';
    setTimeout(function() { msg.style.display = 'none'; }, 2000);

  // 기록 삭제
  window.deleteLogItem = function(logId) {
    if (!confirm('이 취득 기록을 삭제하시겠습니까?')) return;
    database.ref('logs/' + logId).remove()
      .then(function() { alert('삭제되었습니다.'); })
      .catch(function(err) { alert('삭제 실패: ' + err.message); });
  };

  // 기록 수정 시작/취소/저장
  window.startEditLogItem = function(logId) { editingId = logId; renderHistory(); };
  window.cancelEditLogItem = function() { editingId = null; renderHistory(); };

  window.saveEditLogItem = function(logId) {
    var updateData = {
      scenario: document.getElementById('editScenario_' + logId).value,
      target: document.getElementById('editTarget_' + logId).value,
      special: document.getElementById('editSpecial_' + logId).value,
      child: document.getElementById('editChild_' + logId).value,
      note: document.getElementById('editNote_' + logId).value
    };

    database.ref('logs/' + logId).update(updateData)
      .then(function() {
        editingId = null;
        alert('수정되었습니다.');
      })
      .catch(function(err) { alert('수정 실패: ' + err.message); });
  };

  function renderHistory() {
    cleanupOldLogs();
  var listArea = document.getElementById('historyCards');
  if (!listArea) return;

  // 💡 [원인 해결 1] 웹페이지 전체 스크롤과 목록 상자 내부 스크롤 위치를 모두 저장
  var pageScrollY = window.scrollY || document.documentElement.scrollTop;
  var containerScrollTop = listArea.scrollTop;

  listArea.innerHTML = '';

  if (!globalLogs || globalLogs.length === 0) {
    listArea.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:13px;">저장된 취득 내역이 없습니다.</div>';
    return;
  }

  // 1. 날짜별 그룹화 (timestamp에서 YYYY-MM-DD 추출)
  var groups = {};
  globalLogs.slice().reverse().forEach(function(item) {
    var dateKey = item.acqDate || item.date;
    
    if (!dateKey) {
      if (item.timestamp) {
        var d = new Date(item.timestamp);
        dateKey = d.getFullYear() + '-' + fmt(d.getMonth() + 1) + '-' + fmt(d.getDate());
      } else {
        dateKey = new Date().toISOString().substring(0, 10);
      }
    }

    if (!groups[dateKey]) {
      groups[dateKey] = [];
    }
    groups[dateKey].push(item);
  });

  // 2. 날짜별 그룹 렌더링 (최신 날짜순)
  Object.keys(groups).sort().reverse().forEach(function(dateKey) {
    var groupHeader = document.createElement('div');
    groupHeader.className = 'history-date-header';
    groupHeader.style.cssText = 'font-weight: bold; font-size: 13px; color: var(--text-accent); background: var(--bg-accent, #eef2f7); padding: 6px 10px; border-radius: 6px; margin: 12px 0 6px 0; display: flex; align-items: center; justify-content: space-between;';
    groupHeader.innerHTML = `<span>📅 ${dateKey}</span> <span style="font-size:11px; font-weight:normal; color:var(--text-secondary);">${groups[dateKey].length}건</span>`;
    listArea.appendChild(groupHeader);

    groups[dateKey].forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'history-card';
      
      var isRoad = item.type === 'road';
      var badgeClass = isRoad ? 'badge-type badge-road' : 'badge-type badge-parking';
      var typeText = isRoad ? '주행 취득건' : '주차 취득건';

      if (typeof editingId !== 'undefined' && editingId === item.id) {
        div.innerHTML = `
          <div style="font-size:12px; font-weight:bold; color:#0d6efd; margin-bottom:4px;">✏️ 취득 내역 수정</div>
          <div class="grid-2">
            <div class="form-group">
              <label>시나리오</label>
              <input type="text" id="editScenario_${item.id}" class="form-control" value="${item.scenario || ''}">
            </div>
            <div class="form-group">
              <label>목표 대상</label>
              <input type="text" id="editTarget_${item.id}" class="form-control" value="${item.target || ''}">
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:6px;">
            <button type="button" class="btn-edit-save" onclick="event.preventDefault(); event.stopPropagation(); saveEditLogItem('${item.id}')">저장</button>
            <button type="button" class="btn-edit-cancel" onclick="event.preventDefault(); event.stopPropagation(); cancelEditLogItem()">취소</button>
          </div>
        `;
      } else {
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="${badgeClass}">${typeText}</span>
            <div>
              <!-- 💡 [원인 해결 2] event.preventDefault() 및 event.stopPropagation()으로 기본 클릭 동작과 이벤트 튀김 차단 -->
              <button type="button" class="icon-btn" style="color:#0d6efd;" onclick="event.preventDefault(); event.stopPropagation(); startEditLogItem('${item.id}')" title="수정"><i class="ti ti-edit"></i></button>
              <button type="button" class="icon-btn" style="color:#dc3545;" onclick="event.preventDefault(); event.stopPropagation(); deleteLogItem('${item.id}')" title="삭제"><i class="ti ti-trash"></i></button>
            </div>
          </div>
          <div style="font-weight:bold; margin-top:2px;">📍 ${item.location || '위치 정보 없음'}</div>
          <div style="font-size:12px; color:var(--text-secondary);">
            시간: ${item.startTime || ''} ~ ${item.endTime || ''} (${item.duration || '00:00'}) | 환경: <strong>${item.env || '-'}</strong>
          </div>
          <div style="font-size:12px; color:var(--text-secondary);">
            시나리오: <strong>${item.scenario || '-'}</strong>
          </div>
          <div style="font-size:11px; color:var(--text-muted);">
            목표: ${item.target || '-'} | SPECIAL: ${item.special || 'x'} | 아이: ${item.child || 'x'} ${item.note ? '| 비고: ' + item.note : ''}
          </div>
        `;
      }
      listArea.appendChild(div);
    });
  });

  // 💡 [원인 해결 3] 화면을 전부 다 재렌더링한 후 저장해둔 두 스크롤 위치를 동시에 복원
  listArea.scrollTop = containerScrollTop;
  window.scrollTo(0, pageScrollY);
}

function cleanupOldLogs() {
  if (!globalLogs || globalLogs.length === 0) return;

  function getItemDate(item) {
    var dateKey = item.acqDate || item.date;
    if (!dateKey) {
      if (item.timestamp) {
        var d = new Date(item.timestamp);
        var m = (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1);
        var day = (d.getDate() < 10 ? '0' : '') + d.getDate();
        dateKey = d.getFullYear() + '-' + m + '-' + day;
      } else {
        dateKey = new Date().toISOString().substring(0, 10);
      }
    }
    return dateKey;
  }

  var uniqueDates = Array.from(new Set(globalLogs.map(getItemDate))).sort();

  var MAX_DAYS = 20;
  if (uniqueDates.length > MAX_DAYS) {
    var keepDates = new Set(uniqueDates.slice(-MAX_DAYS));

    globalLogs = globalLogs.filter(function(item) {
      return keepDates.has(getItemDate(item));
    });

    if (typeof saveLogsToStorage === 'function') {
      saveLogsToStorage();
    }
  }
}

function executeSendEmail() {
  var rawEmailInput = document.getElementById('targetEmailInput').value.trim();
  if (!rawEmailInput) { alert('수신할 이메일 주소를 입력해 주세요.'); return; }

  // 쉼표(,), 세미콜론(;), 공백으로 구분해서 다수 이메일 배열 만들기
  var emailList = rawEmailInput.split(/[,;\s]+/).filter(function(e) { return e.length > 0; });
  if (emailList.length === 0) { alert('올바른 이메일 주소를 입력해 주세요.'); return; }
  
  // 💡 [추가] 데이터 존재 여부 확인 코드
  if (globalLogs.length === 0) { alert('전송할 측정 데이터가 없습니다.'); return; }

  var ssd = document.getElementById('inputSSD').value || '14';
  var acqDate = (document.getElementById('inputAcqDate').value || new Date().toISOString().substring(0, 10)).replace(/-/g, '');

  var htmlMsg = `
    <h3 style="font-family: sans-serif; color: #333;">📋 데이터 수집 리포트</h3>
    <table border="1" cellpadding="6" cellspacing="0" style="border-collapse: collapse; font-family: sans-serif; font-size: 12px; text-align: center; width: 100%;">
      <thead>
        <tr style="background-color: #1f2d3d; color: #ffffff; font-weight: bold;">
          <th>시나리오</th>
          <th>취득일</th>
          <th>SSD</th>
          <th>위치</th>
          <th>환경</th>
          <th>취득 시작시간</th>
          <th>취득 종료시간</th>
          <th>취득 시간</th>
          <th>목표 대상</th>
          <th>비고</th>
          <th>SPECIAL</th>
          <th>아이</th>
        </tr>
      </thead>
      <tbody>
  `;

  globalLogs.forEach(function(item) {
    var specTd = item.special === 'o' ? '<td style="background-color:#e8f4fe; color:#0d6efd; font-weight:bold;">o</td>' : '<td style="background-color:#fde8e8; color:#dc3545; font-weight:bold;">x</td>';
    var childTd = item.child === 'o' ? '<td style="background-color:#e8f4fe; color:#0d6efd; font-weight:bold;">o</td>' : '<td style="background-color:#fde8e8; color:#dc3545; font-weight:bold;">x</td>';

    // 💡 [수정 포인트] 도로 경로(roadPath)가 있으면 기존 위치 아래에 추가해줍니다.
    var locDisplay = item.location || '';
    if (item.roadPath) {
      locDisplay += `<br><span style="font-size:11px; color:#555; font-weight:normal;">(${item.roadPath})</span>`;
    }

    htmlMsg += `
      <tr>
        <td style="font-weight: bold;">${item.scenario}</td>
        <td>${acqDate}</td>
        <td>${ssd}</td>
        <td style="text-align: left;">${locDisplay}</td>
        <td>${item.env}</td>
        <td>${item.startTime}</td>
        <td>${item.endTime}</td>
        <td>${item.duration}</td>
        <td style="text-align: left;">${item.target}</td>
        <td style="text-align: left;">${item.note || ''}</td>
        ${specTd}
        ${childTd}
      </tr>
    `;
  });

  htmlMsg += `</tbody></table>`;

  // EmailJS 파라미터 구조
  // 입력된 모든 이메일로 각각 발송
  var sendPromises = emailList.map(function(email) {
    var templateParams = {
      to_email: email,
      report_rows: htmlMsg,
      message_html: htmlMsg
    };
    return emailjs.send('service_0mu4e21', 'template_86vlpyu', templateParams);
  });

  Promise.all(sendPromises)
    .then(function() {
      alert('총 ' + emailList.length + '명(' + emailList.join(', ') + ')에게 메일 전송이 완료되었습니다!');

}

var timerInterval = null;

// 타이머 화면 갱신 (시간 숫만 변경)
function updateTimerDisplay(seconds) {
  var hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
  var min = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
  var sec = String(seconds % 60).padStart(2, '0');
  
  var timeStr = '[' + hrs + ':' + min + ':' + sec + ']';
  var activeTimerText = document.getElementById('overlayTimerVal');

  if (activeTimerText) {
    activeTimerText.textContent = timeStr;
  }
}

// [취득 시작] 누를 때 실행되는 함수
function startTimer() {
  var startTime = Date.now();
  if (timerInterval) clearInterval(timerInterval);

  // 1. 숨겨져 있던 타이머 박스를 화면에 보이게 켜기
  var timerOverlay = document.getElementById('mapOverlayTimer');
  if (timerOverlay) {
    timerOverlay.style.display = 'inline-flex';
  }

  // 2. 1초마다 타이머 숫자 올리기
  updateTimerDisplay(0);
  timerInterval = setInterval(function() {
    var elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
    updateTimerDisplay(elapsedSeconds);
  }, 1000);
}

// [취득 종료] 누를 때 실행되는 함수
function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  // 타이머 박스를 다시 화면에서 안 보이게 숨기기
  var timerOverlay = document.getElementById('mapOverlayTimer');
  if (timerOverlay) {
    timerOverlay.style.display = 'none';
  }
}
